<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portrait — Polina Stukalova</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #eee7dd;
  color: #332b25;
  font-family: Georgia, "Times New Roman", serif;
}

a {
  color: inherit;
  text-decoration: none;
}


/* ================= HEADER ================= */

header {
  padding: 25px 5%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  border-bottom: 1px solid #d2c5b7;
}

.logo {
  font-size: 18px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.back {
  font-family: Arial, sans-serif;

  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;

  transition: opacity .3s ease;
}

.back:hover {
  opacity: .45;
}


/* ================= TITLE ================= */

.gallery-header {
  text-align: center;

  padding: 120px 30px 80px;
}

.gallery-header span {
  display: block;

  font-family: Arial, sans-serif;

  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;

  color: #8a796a;

  margin-bottom: 18px;
}

.gallery-header h1 {
  font-size: clamp(55px, 9vw, 110px);

  font-weight: normal;

  line-height: .95;

  margin-bottom: 25px;
}

.gallery-header p {
  font-size: 17px;

  font-style: italic;

  color: #66594e;
}


/* ================= GALLERY ================= */

.gallery {

  max-width: 1300px;

  margin: auto;

  padding: 0 5% 140px;

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 25px;
}

.gallery img {

  width: 100%;

  height: auto;

  display: block;

  cursor: pointer;

  transition: opacity .4s ease;
}

.gallery img:hover {
  opacity: .8;
}


/* ================= FOOTER ================= */

footer {

  padding: 30px 5%;

  border-top: 1px solid #d2c5b7;

  display: flex;

  justify-content: space-between;

  font-family: Arial, sans-serif;

  font-size: 9px;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #88796c;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

  .logo {
    font-size: 13px;
  }

  .gallery {
    grid-template-columns: 1fr;

    padding-left: 7%;
    padding-right: 7%;
  }

  .gallery-header {
    padding-top: 90px;
  }

  footer {
    flex-direction: column;

    gap: 10px;

    text-align: center;
  }

}

</style>

</head>


<body>


<header>

  <a href="index.html" class="logo">
    Polina Stukalova
  </a>

  <a href="index.html" class="back">
    ← Back to portfolio
  </a>

</header>


<section class="gallery-header">

  <span>
    Selected work
  </span>

  <h1>
    Portrait
  </h1>

  <p>
    Emotion · Moment · Light
  </p>

</section>


<section class="gallery">

  <img src="images/portrait/portrait-1.jpg" alt="Portrait photography">

  <img src="images/portrait/portrait-2.jpg" alt="Portrait photography">

  <img src="images/portrait/portrait-3.jpg" alt="Portrait photography">

  <img src="images/portrait/portrait-4.jpg" alt="Portrait photography">

</section>


<footer>

  <span>
    © 2026 Polina Stukalova
  </span>

  <span>
    Photography
  </span>

</footer>


</body>
</html>
