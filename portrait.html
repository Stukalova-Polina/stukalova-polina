<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portrait — Polina Stukalova</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #eee7dd;
  color: #332b25;
  font-family: Georgia, "Times New Roman", serif;
}

a {
  color: inherit;
  text-decoration: none;
}


/* ================= HEADER ================= */

header {
  padding: 25px 5%;

  display: flex;
  justify-content: space-between;
  align-items: center;

  border-bottom: 1px solid #d2c5b7;
}

.logo {
  font-size: 18px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.back {
  font-family: Arial, sans-serif;

  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;

  transition: opacity .3s ease;
}

.back:hover {
  opacity: .45;
}


/* ================= TITLE ================= */

.gallery-header {
  text-align: center;

  padding: 120px 30px 80px;
}

.gallery-header span {
  display: block;

  font-family: Arial, sans-serif;

  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;

  color: #8a796a;

  margin-bottom: 18px;
}

.gallery-header h1 {
  font-size: clamp(55px, 9vw, 110px);

  font-weight: normal;

  line-height: .95;

  margin-bottom: 25px;
}

.gallery-header p {
  font-size: 17px;

  font-style: italic;

  color: #66594e;
}


/* ================= GALLERY ================= */

.gallery {

  max-width: 1400px;

  margin: auto;

  padding: 0 5% 140px;

  columns: 2 500px;

  column-gap: 25px;
}

.gallery img {

  width: 100%;

  height: auto;

  display: block;

  margin-bottom: 25px;

  cursor: pointer;

  transition:
    opacity .4s ease,
    transform .4s ease;

  break-inside: avoid;
}

.gallery img:hover {
  opacity: .85;
  transform: scale(.995);
}


/* ================= LIGHTBOX ================= */

.lightbox {

  position: fixed;

  inset: 0;

  z-index: 1000;

  background: rgba(30, 24, 20, .94);

  display: flex;

  justify-content: center;

  align-items: center;

  padding: 40px;

  opacity: 0;

  visibility: hidden;

  transition:
    opacity .35s ease,
    visibility .35s ease;
}

.lightbox.active {

  opacity: 1;

  visibility: visible;
}

.lightbox img {

  max-width: 92vw;

  max-height: 90vh;

  object-fit: contain;

  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.lightbox-close {

  position: absolute;

  top: 25px;
  right: 35px;

  color: white;

  font-family: Arial, sans-serif;

  font-size: 30px;

  font-weight: 200;

  cursor: pointer;

  opacity: .8;

  transition: opacity .3s ease;
}

.lightbox-close:hover {
  opacity: 1;
}


/* ================= FOOTER ================= */

footer {

  padding: 30px 5%;

  border-top: 1px solid #d2c5b7;

  display: flex;

  justify-content: space-between;

  font-family: Arial, sans-serif;

  font-size: 9px;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #88796c;
}


/* ================= MOBILE ================= */

@media (max-width: 700px) {

  header {
    padding: 20px;
  }

  .logo {
    font-size: 13px;
  }

  .back {
    font-size: 8px;
  }

  .gallery-header {
    padding: 90px 20px 60px;
  }

  .gallery {
    columns: 1;
    padding-left: 7%;
    padding-right: 7%;
  }

  .gallery img {
    margin-bottom: 18px;
  }

  .lightbox {
    padding: 20px;
  }

  .lightbox img {
    max-width: 95vw;
    max-height: 85vh;
  }

  .lightbox-close {
    top: 15px;
    right: 20px;
  }

  footer {
    flex-direction: column;

    gap: 10px;

    text-align: center;
  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

  <a href="index.html" class="logo">
    Polina Stukalova
  </a>

  <a href="index.html" class="back">
    ← Back to portfolio
  </a>

</header>


<!-- ================= TITLE ================= -->

<section class="gallery-header">

  <span>
    Selected work
  </span>

  <h1>
    Portrait
  </h1>

  <p>
    Emotion · Moment · Light
  </p>

</section>


<!-- ================= GALLERY ================= -->

<section class="gallery">


  <!-- Add your photographs here -->

  <img
    src="images/portrait/portrait-1.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-2.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-3.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-4.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-5.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-6.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-7.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-8.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-9.jpg"
    alt="Portrait photography"
  >

  <img
    src="images/portrait/portrait-10.jpg"
    alt="Portrait photography"
  >

  <!--
  Continue if you have more photos:

  <img src="images/portrait/portrait-11.jpg" alt="Portrait photography">
  <img src="images/portrait/portrait-12.jpg" alt="Portrait photography">
  <img src="images/portrait/portrait-13.jpg" alt="Portrait photography">
  -->


</section>


<!-- ================= LIGHTBOX ================= -->

<div class="lightbox" id="lightbox">

  <div class="lightbox-close" id="lightboxClose">
    ×
  </div>

  <img id="lightboxImage" src="" alt="">

</div>


<!-- ================= FOOTER ================= -->

<footer>

  <span>
    © 2026 Polina Stukalova
  </span>

  <span>
    Photography
  </span>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script>

const galleryImages = document.querySelectorAll(".gallery img");

const lightbox = document.getElementById("lightbox");

const lightboxImage = document.getElementById("lightboxImage");

const lightboxClose = document.getElementById("lightboxClose");


galleryImages.forEach(function(image) {

  image.addEventListener("click", function() {

    lightboxImage.src = image.src;

    lightboxImage.alt = image.alt;

    lightbox.classList.add("active");

  });

});


lightboxClose.addEventListener("click", function() {

  lightbox.classList.remove("active");

});


lightbox.addEventListener("click", function(event) {

  if (event.target === lightbox) {

    lightbox.classList.remove("active");

  }

});


document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {

    lightbox.classList.remove("active");

  }

});

</script>


</body>
</html>
